name: CADOS Flutter FTMS Spike

on:
  workflow_dispatch:
  push:
    paths:
      - "spike/flutter_ftms/**"
      - ".github/workflows/flutter-ftms-spike.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/flutter_ftms
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  macos:
    needs: quality
    runs-on: macos-15
    defaults:
      run:
        working-directory: spike/flutter_ftms
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Pack macOS app
        run: |
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" cados-ftms-spike-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cados-ftms-spike-macos
          path: spike/flutter_ftms/cados-ftms-spike-macos.zip
          if-no-files-found: error

  android:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/flutter_ftms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cados-ftms-spike-android
          path: spike/flutter_ftms/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spike/flutter_ftms
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Pack Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cados-ftms-spike-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cados-ftms-spike-windows
          path: spike/flutter_ftms/cados-ftms-spike-windows.zip
          if-no-files-found: error
