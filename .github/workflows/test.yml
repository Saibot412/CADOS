name: CADOS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cados_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cados_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements.txt httpx
      - run: python -m unittest discover -s tests -p 'test_server*.py' -v
        env:
          CADOS_TEST_DATABASE_URL: postgresql+psycopg://cados_test:ci_test_password@localhost:5432/cados_test
      - run: python -m unittest discover -s tests -p 'test_account_sync.py' -v
      - run: docker build -f server/Dockerfile -t cados:test .
