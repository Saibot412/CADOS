name: CADOS Flutter quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-app.yml"
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-app.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
