[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cados"
version = "0.4.1"
description = "Indoor cycling web platform with a local Bluetooth connector."
readme = "DOKUMENTATION.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "bleak>=0.22",
  "certifi>=2024.0.0",
  "websockets>=15.0",
]

[project.scripts]
cados = "cados.connector_app:run"
cados-connector = "cados.connector_app:run"
cados-connector-cli = "cados.connector:run"

[tool.setuptools]
packages = ["cados", "cados.core", "cados.models", "cados.services"]

[tool.setuptools.package-data]
cados = ["assets/local/*", "assets/*.png", "assets/workouts/*.json"]
